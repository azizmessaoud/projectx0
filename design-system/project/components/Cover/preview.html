  .node { fill:var(--foreground); opacity:.7; }
  .node.cut { fill:var(--violet-400); opacity:1; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-heading); font-size:120px; line-height:.92; font-weight:700; letter-spacing:-.025em; color:var(--foreground); }
  .name span { color:var(--secondary); }
